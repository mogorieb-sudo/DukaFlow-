<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DukaFlow - Subscription</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    .container {
      max-width: 500px;
      margin: 40px auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 25px;
    }

    .status {
      padding: 14px;
      border-radius: 10px;
      background: #f1f5f9;
      margin: 20px 0;
    }

    .status strong {
      display: block;
      margin-bottom: 5px;
    }

    .price {
      font-size: 32px;
      font-weight: bold;
      margin: 20px 0;
    }

    .price span {
      font-size: 15px;
      font-weight: normal;
      color: #777;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d5dbe3;
      border-radius: 9px;
      font-size: 16px;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 9px;
      background: #16a34a;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .loading {
      background: #fef3c7;
      color: #92400e;
    }

    .details {
      line-height: 1.8;
      color: #555;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <h1>DukaFlow Subscription</h1>

      <div class="status">
        <strong id="subscriptionStatus">
          Checking subscription...
        </strong>

        <span id="subscriptionMessage">
          Please wait.
        </span>
      </div>

      <div class="details">
        <div>
          Plan: <strong>Monthly</strong>
        </div>

        <div>
          Price: <strong>KSh 300</strong>
        </div>

        <div id="expiryText">
        </div>
      </div>

      <div class="price">
        KSh 300
        <span>/ 30 days</span>
      </div>

      <label for="phoneNumber">
        M-Pesa Phone Number
      </label>

      <input
        type="tel"
        id="phoneNumber"
        placeholder="0712345678"
        autocomplete="tel"
      >

      <button id="payButton">
        Pay KSh 300
      </button>

      <div
        id="message"
        class="message"
      ></div>

    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    const SUPABASE_URL =
      "https://uwfghbctckinymatcbro.supabase.co";

    const SUPABASE_ANON_KEY =
      "sb_publishable_Qj4YqDW3lU2ouxevXa0upg_zbxzJG-X";

    const MPESA_FUNCTION_URL =
      `${SUPABASE_URL}/functions/v1/mpesa-payment`;

    const BUSINESS_ID =
      "499f9d20-b29d-42a7-8508-3681dcc046c4";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    const statusElement =
      document.getElementById(
        "subscriptionStatus"
      );

    const subscriptionMessage =
      document.getElementById(
        "subscriptionMessage"
      );

    const expiryText =
      document.getElementById(
        "expiryText"
      );

    const phoneInput =
      document.getElementById(
        "phoneNumber"
      );

    const payButton =
      document.getElementById(
        "payButton"
      );

    const messageElement =
      document.getElementById(
        "message"
      );


    function showMessage(
      text,
      type
    ) {

      messageElement.textContent = text;

      messageElement.className =
        `message ${type}`;

      messageElement.style.display =
        "block";
    }


    function hideMessage() {

      messageElement.style.display =
        "none";

    }


    function formatDate(date) {

      return new Date(date)
        .toLocaleDateString(
          "en-KE",
          {
            day: "numeric",
            month: "long",
            year: "numeric"
          }
        );

    }


    async function loadSubscription() {

      const {
        data: {
          session
        }
      } =
        await supabaseClient
          .auth
          .getSession();


      if (!session) {

        statusElement.textContent =
          "Not logged in";

        subscriptionMessage.textContent =
          "Please log in to continue.";

        payButton.disabled = true;

        return;

      }


      const {
        data: subscription,
        error
      } =
        await supabaseClient
          .from("subscriptions")
          .select("*")
          .eq(
            "business_id",
            BUSINESS_ID
          )
          .maybeSingle();


      if (error) {

        console.error(error);

        statusElement.textContent =
          "Unable to load subscription";

        subscriptionMessage.textContent =
          error.message;

        return;

      }


      if (!subscription) {

        statusElement.textContent =
          "No subscription";

        subscriptionMessage.textContent =
          "Subscribe to continue using DukaFlow.";

        expiryText.textContent = "";

        return;

      }


      if (
        subscription.status ===
        "trialing"
      ) {

        statusElement.textContent =
          "Free Trial";

        subscriptionMessage.textContent =
          "Your DukaFlow trial is active.";

        expiryText.innerHTML =
          `Trial ends: <strong>${formatDate(
            subscription.trial_ends_at
          )}</strong>`;

        return;

      }


      if (
        subscription.status ===
        "active"
      ) {

        statusElement.textContent =
          "Subscription Active";

        subscriptionMessage.textContent =
          "Your DukaFlow subscription is active.";

        expiryText.innerHTML =
          `Expires: <strong>${formatDate(
            subscription.current_period_end
          )}</strong>`;

        return;

      }


      if (
        subscription.status ===
        "expired"
      ) {

        statusElement.textContent =
          "Subscription Expired";

        subscriptionMessage.textContent =
          "Renew your subscription to continue.";

        expiryText.innerHTML =
          "Your subscription has expired.";

        return;

      }


      statusElement.textContent =
        subscription.status;

    }


    payButton.addEventListener(
      "click",
      async () => {

        hideMessage();

        const phone =
          phoneInput.value.trim();


        if (!phone) {

          showMessage(
            "Enter your M-Pesa phone number.",
            "error"
          );

          return;

        }


        payButton.disabled = true;

        payButton.textContent =
          "Sending STK Push...";


        try {

          const {
            data: {
              session
            }
          } =
            await supabaseClient
              .auth
              .getSession();


          if (!session) {

            throw new Error(
              "Your session has expired. Please log in again."
            );

          }


          const response =
            await fetch(
              MPESA_FUNCTION_URL,
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json",

                  "Authorization":
                    `Bearer ${session.access_token}`
                },

                body: JSON.stringify({
                  business_id:
                    BUSINESS_ID,

                  phone_number:
                    phone
                })
              }
            );


          const result =
            await response.json();


          if (!response.ok ||
              !result.success) {

            throw new Error(
              result.error ||
              "Unable to start payment."
            );

          }


          showMessage(
            result.customer_message ||
            "STK Push sent. Check your phone and enter your M-Pesa PIN.",
            "loading"
          );


          payButton.textContent =
            "Waiting for Payment...";


          /*
             Daraja callback happens
             separately on the server.

             Give the user time to
             complete the payment.
          */

          setTimeout(
            async () => {

              await loadSubscription();

              payButton.disabled =
                false;

              payButton.textContent =
                "Pay KSh 300";

            },
            15000
          );


        } catch (error) {

          console.error(
            "Payment error:",
            error
          );

          showMessage(
            error.message ||
            "Payment could not be started.",
            "error"
          );

          payButton.disabled =
            false;

          payButton.textContent =
            "Pay KSh 300";

        }

      }
    );


    loadSubscription();

  </script>

</body>
</html>
