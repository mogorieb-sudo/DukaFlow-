<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>DukaFlow - Create Account</title>

<link
    rel="stylesheet"
    href="style.css"
>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
}

.register-container {
    width: 100%;
    max-width: 440px;
    margin: 30px auto;
    padding: 20px;
}

.register-card {
    background: #ffffff;
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
}

.register-card h1 {
    margin: 0;
    text-align: center;
    color: #087f3f;
    font-size: 30px;
}

.register-subtitle {
    margin: 7px 0 24px;
    text-align: center;
    color: #64748b;
    font-size: 14px;
}

.register-card label.form-label {
    display: block;
    margin-top: 15px;
    margin-bottom: 7px;
    color: #1e293b;
    font-size: 14px;
    font-weight: 700;
}

.register-card input[type="text"],
.register-card input[type="email"],
.register-card input[type="password"] {
    width: 100%;
    padding: 13px 14px;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    background: #ffffff;
    color: #0f172a;
    font-size: 15px;
    outline: none;
    transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
}

.register-card input[type="text"]:focus,
.register-card input[type="email"]:focus,
.register-card input[type="password"]:focus {
    border-color: #087f3f;
    box-shadow: 0 0 0 3px rgba(8, 127, 63, 0.10);
}

.password-box {
    position: relative;
    width: 100%;
}

.password-box input {
    padding-right: 48px !important;
}

.show-password {
    position: absolute;
    right: 5px;
    top: 50%;
    transform: translateY(-50%);
    width: 38px !important;
    height: 38px;
    margin: 0 !important;
    padding: 0 !important;
    border: none !important;
    background: transparent !important;
    color: #64748b !important;
    font-size: 17px !important;
    cursor: pointer;
}

.show-password:hover {
    color: #087f3f !important;
}

/* =====================================================
   BUSINESS WORKSPACE
===================================================== */

.workspace-heading {
    margin-top: 22px;
    margin-bottom: 5px;
    color: #1e293b;
    font-size: 14px;
    font-weight: 700;
}

.workspace-help {
    margin: 0 0 10px;
    color: #64748b;
    font-size: 13px;
    line-height: 1.45;
}

.workspace-options {
    display: grid;
    gap: 10px;
}

.workspace-option {
    position: relative;
    display: block;
    cursor: pointer;
}

.workspace-option input {
    position: absolute;
    opacity: 0;
    pointer-events: none;
}

.workspace-card {
    position: relative;
    display: block;
    padding: 15px;
    border: 2px solid #e2e8f0;
    border-radius: 13px;
    background: linear-gradient(
        135deg,
        #ffffff,
        #f8fafc
    );
    transition:
        border-color 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease,
        transform 0.2s ease;
}

.workspace-card:hover {
    border-color: #86efac;
    background: #f0fdf4;
    transform: translateY(-1px);
}

.workspace-option input:checked + .workspace-card {
    border-color: #087f3f;
    background: linear-gradient(
        135deg,
        #ecfdf5,
        #f0fdf4
    );
    box-shadow:
        0 5px 15px rgba(8, 127, 63, 0.12);
}

.workspace-option input:checked + .workspace-card::after {
    content: "✓";
    position: absolute;
    top: 12px;
    right: 12px;
    width: 25px;
    height: 25px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: #087f3f;
    color: #ffffff;
    font-size: 14px;
    font-weight: 800;
}

.workspace-title {
    display: block;
    padding-right: 35px;
    color: #0f172a;
    font-size: 15px;
    font-weight: 800;
}

.workspace-description {
    display: block;
    margin-top: 5px;
    padding-right: 15px;
    color: #64748b;
    font-size: 13px;
    line-height: 1.45;
}

/* =====================================================
   CREATE BUTTON
===================================================== */

.create-button {
    width: 100%;
    margin-top: 22px;
    padding: 13px 16px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(
        135deg,
        #087f3f,
        #0b7a3b
    );
    color: #ffffff;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    box-shadow:
        0 5px 14px rgba(8, 127, 63, 0.20);
    transition:
        transform 0.2s ease,
        opacity 0.2s ease;
}

.create-button:hover:not(:disabled) {
    transform: translateY(-1px);
}

.create-button:disabled {
    opacity: 0.65;
    cursor: not-allowed;
}

/* =====================================================
   MESSAGE
===================================================== */

#registerMessage {
    min-height: 20px;
    margin: 15px 0 0;
    text-align: center;
    color: #334155;
    font-size: 14px;
    font-weight: 700;
    line-height: 1.45;
}

/* =====================================================
   LOGIN LINK
===================================================== */

.login-link {
    margin: 20px 0 0;
    text-align: center;
    color: #64748b;
    font-size: 14px;
}

.login-link a {
    color: #087f3f;
    font-weight: 800;
    text-decoration: none;
}

.login-link a:hover {
    text-decoration: underline;
}

/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 480px) {

    .register-container {
        margin: 10px auto;
        padding: 12px;
    }

    .register-card {
        padding: 23px 18px;
        border-radius: 15px;
    }

    .register-card h1 {
        font-size: 27px;
    }

}

</style>

</head>


<body>

<div class="register-container">

<div class="register-card">

<h1>DukaFlow</h1>

<p class="register-subtitle">
Create your business account
</p>


<form id="registerForm">


<!-- =====================================================
     PERSONAL INFORMATION
===================================================== -->

<label
    class="form-label"
    for="fullName"
>
Full Name
</label>

<input
    type="text"
    id="fullName"
    placeholder="Enter your full name"
    autocomplete="name"
    required
>


<!-- =====================================================
     BUSINESS INFORMATION
===================================================== -->

<label
    class="form-label"
    for="businessName"
>
Business Name
</label>

<input
    type="text"
    id="businessName"
    placeholder="Enter your business name"
    autocomplete="organization"
    required
>


<label
    class="form-label"
    for="email"
>
Email
</label>

<input
    type="email"
    id="email"
    placeholder="Enter your email"
    autocomplete="email"
    required
>


<label
    class="form-label"
    for="username"
>
Username
</label>

<input
    type="text"
    id="username"
    placeholder="Choose a username"
    autocomplete="username"
    required
>


<!-- =====================================================
     BUSINESS WORKSPACE
===================================================== -->

<p class="workspace-heading">
Choose your business workspace
</p>

<p class="workspace-help">
This helps DukaFlow open the tools that match how your business operates.
</p>


<div class="workspace-options">


<label class="workspace-option">

<input
    type="radio"
    name="businessType"
    value="product"
    required
>

<span class="workspace-card">

<span class="workspace-title">
🛍️ Product Business
</span>

<span class="workspace-description">
For shops, pharmacies, retail, hardware, wholesalers and businesses selling products.
</span>

</span>

</label>


<label class="workspace-option">

<input
    type="radio"
    name="businessType"
    value="service"
>

<span class="workspace-card">

<span class="workspace-title">
🧑‍💼 Service Business
</span>

<span class="workspace-description">
For companies managing clients, services, staff, assignments, attendance, invoices and payments.
</span>

</span>

</label>


</div>


<!-- =====================================================
     PASSWORD
===================================================== -->

<label
    class="form-label"
    for="password"
>
Password
</label>

<div class="password-box">

<input
    type="password"
    id="password"
    placeholder="Create a password"
    minlength="6"
    autocomplete="new-password"
    required
>

<button
    type="button"
    class="show-password"
    id="showPassword"
    aria-label="Show password"
>
👁️
</button>

</div>


<label
    class="form-label"
    for="confirmPassword"
>
Confirm Password
</label>

<div class="password-box">

<input
    type="password"
    id="confirmPassword"
    placeholder="Confirm your password"
    minlength="6"
    autocomplete="new-password"
    required
>

<button
    type="button"
    class="show-password"
    id="showConfirmPassword"
    aria-label="Show confirm password"
>
👁️
</button>

</div>


<button
    type="submit"
    class="create-button"
    id="registerButton"
>
CREATE ACCOUNT
</button>


</form>


<p id="registerMessage"></p>


<p class="login-link">

Already have an account?

<a href="login.html">
Login
</a>

</p>

</div>

</div>


<!-- =====================================================
     SUPABASE
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

console.log(
    "DukaFlow registration script loaded"
);


// =====================================================
// SUPABASE CONNECTION
// =====================================================

const SUPABASE_URL =
    "https://uwfghbctckinymatcbro.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_Qj4YqDW3lU2ouxevXa0upg_zbxzJG-X";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


// =====================================================
// ELEMENTS
// =====================================================

const form =
    document.getElementById(
        "registerForm"
    );


const fullNameInput =
    document.getElementById(
        "fullName"
    );


const businessNameInput =
    document.getElementById(
        "businessName"
    );


const emailInput =
    document.getElementById(
        "email"
    );


const usernameInput =
    document.getElementById(
        "username"
    );


const passwordInput =
    document.getElementById(
        "password"
    );


const confirmPasswordInput =
    document.getElementById(
        "confirmPassword"
    );


const message =
    document.getElementById(
        "registerMessage"
    );


const button =
    document.getElementById(
        "registerButton"
    );


const businessTypeInputs =
    document.querySelectorAll(
        'input[name="businessType"]'
    );


// =====================================================
// SHOW / HIDE PASSWORD
// =====================================================

document
    .getElementById("showPassword")
    .addEventListener(
        "click",
        function() {

            const isHidden =
                passwordInput.type ===
                "password";


            passwordInput.type =
                isHidden
                    ? "text"
                    : "password";


            this.innerHTML =
                isHidden
                    ? "🙈"
                    : "👁️";

        }
    );


document
    .getElementById("showConfirmPassword")
    .addEventListener(
        "click",
        function() {

            const isHidden =
                confirmPasswordInput.type ===
                "password";


            confirmPasswordInput.type =
                isHidden
                    ? "text"
                    : "password";


            this.innerHTML =
                isHidden
                    ? "🙈"
                    : "👁️";

        }
    );


// =====================================================
// CLEAR MESSAGE WHEN WORKSPACE CHANGES
// =====================================================

businessTypeInputs.forEach(
    function(input) {

        input.addEventListener(
            "change",
            function() {

                if (
                    message.innerHTML.includes(
                        "business workspace"
                    )
                ) {

                    message.innerHTML =
                        "";

                }

            }
        );

    }
);


// =====================================================
// REGISTRATION
// =====================================================

form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const fullName =
            fullNameInput.value
                .trim();


        const businessName =
            businessNameInput.value
                .trim();


        const email =
            emailInput.value
                .trim()
                .toLowerCase();


        const username =
            usernameInput.value
                .trim();


        const password =
            passwordInput.value;


        const confirmPassword =
            confirmPasswordInput.value;


        const selectedBusinessType =
            document.querySelector(
                'input[name="businessType"]:checked'
            );


        const businessType =
            selectedBusinessType
                ? selectedBusinessType.value
                : "";


        // =================================================
        // VALIDATION
        // =================================================

        if (!fullName) {

            message.innerHTML =
                "❌ Enter your full name.";

            fullNameInput.focus();

            return;

        }


        if (!businessName) {

            message.innerHTML =
                "❌ Enter your business name.";

            businessNameInput.focus();

            return;

        }


        if (!email) {

            message.innerHTML =
                "❌ Enter your email.";

            emailInput.focus();

            return;

        }


        if (!username) {

            message.innerHTML =
                "❌ Choose a username.";

            usernameInput.focus();

            return;

        }


        if (!businessType) {

            message.innerHTML =
                "❌ Choose a business workspace.";

            return;

        }


        if (password.length < 6) {

            message.innerHTML =
                "❌ Password must be at least 6 characters.";

            passwordInput.focus();

            return;

        }


        if (
            password !==
            confirmPassword
        ) {

            message.innerHTML =
                "❌ Passwords do not match.";

            confirmPasswordInput.focus();

            return;

        }


        // =================================================
        // START REGISTRATION
        // =================================================

        button.disabled =
            true;


        button.innerHTML =
            "CREATING ACCOUNT...";


        message.innerHTML =
            "Creating your DukaFlow account...";


        try {


            // =================================================
            // SAVE WORKSPACE LOCALLY
            // =================================================
            // This allows the next onboarding step to know
            // what the user selected before login.
            // It does NOT replace Supabase storage.

            localStorage.setItem(
                "dukaflow_signup_business_type",
                businessType
            );


            // =================================================
            // CREATE AUTH ACCOUNT
            // =================================================

            const {
                data,
                error
            } =
            await supabaseClient
                .auth
                .signUp({

                    email:
                        email,

                    password:
                        password,

                    options: {

                        emailRedirectTo:
                            window.location.origin +
                            "/login.html",

                        data: {

                            full_name:
                                fullName,

                            username:
                                username,

                            business_name:
                                businessName,

                            business_type:
                                businessType

                        }

                    }

                });


            // =================================================
            // SUPABASE ERROR
            // =================================================

            if (error) {

                console.error(
                    "Supabase registration error:",
                    error
                );


                localStorage.removeItem(
                    "dukaflow_signup_business_type"
                );


                message.innerHTML =
                    "❌ " +
                    error.message;


                button.disabled =
                    false;


                button.innerHTML =
                    "CREATE ACCOUNT";


                return;

            }


            console.log(
                "Supabase user created:",
                data.user
            );


            // =================================================
            // SUCCESS
            // =================================================

            if (data.user) {

                message.innerHTML =
                    "✅ Account created successfully!";


                button.innerHTML =
                    "ACCOUNT CREATED";


                /*
                 * Do not reset the form here.
                 * Keeping the values temporarily avoids
                 * unnecessary UI changes while redirecting.
                 */

                setTimeout(
                    function() {

                        window.location.href =
                            "login.html";

                    },
                    1500
                );

            }

            else {

                message.innerHTML =
                    "⚠️ Please check your email to verify your account.";


                button.disabled =
                    false;


                button.innerHTML =
                    "CREATE ACCOUNT";

            }

        }


        catch(error) {

            console.error(
                "Unexpected registration error:",
                error
            );


            localStorage.removeItem(
                "dukaflow_signup_business_type"
            );


            message.innerHTML =
                "❌ Something went wrong. Check your connection and try again.";


            button.disabled =
                false;


            button.innerHTML =
                "CREATE ACCOUNT";

        }

    });

</script>

</body>

</html>
